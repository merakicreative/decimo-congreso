<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simposio Internacional de Estudios Clásicos 2028</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600;700&family=Roboto:wght=400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --color-principal: #2a445e;
            --rosa-pompeya: #b84a39;
            --verde-laurel: #4a6b52;
            --crema-antiguo: #f5f0e6;
            --marfil-suave: #ffffff;
            --texto-oscuro: #2c2523;
            --oro-viejo: #c5a059;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; color: var(--texto-oscuro); background-color: var(--crema-antiguo); line-height: 1.8; }

        .top-bar { background-color: var(--verde-laurel); color: var(--marfil-suave); padding: 8px 20px; display: flex; justify-content: flex-end; gap: 15px; font-size: 0.85rem; font-weight: 500; }
        .top-bar a { color: var(--marfil-suave); text-decoration: none; }

        nav { background-color: var(--marfil-suave); border-bottom: 4px solid var(--color-principal); padding: 1.2rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1rem; color: var(--color-principal); }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: var(--texto-oscuro); font-weight: 500; font-size: 1rem; padding: 6px 12px; }
        .nav-links a:hover, .nav-links a.active { color: var(--color-principal); background-color: rgba(42, 68, 94, 0.08); border-radius: 4px; }

        .main-container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        /* BANNER / TRÁILER VISUAL EN CONTINUO (16 Slides) */
        .carousel-wrapper { width: 100%; max-width: 1200px; margin: 20px auto 40px auto; position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 3px solid var(--oro-viejo); }
        .slider { display: flex; width: 1600%; height: 520px; animation: trailerVisual 64s infinite ease-in-out; }
        .slide { width: 6.25%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }
        
        .slide-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); color: white; padding: 45px; text-align: left; }
        .slide-caption h3 { font-family: 'Cinzel', serif; font-size: 1.7rem; margin-bottom: 5px; color: var(--oro-viejo); text-shadow: 1px 1px 4px rgba(0,0,0,0.6); }
        .slide-caption p { font-size: 1rem; opacity: 0.9; font-weight: 400; }

        @keyframes trailerVisual {
            0%, 4.5% { transform: translateX(0); }
            6.25%, 10.75% { transform: translateX(-6.25%); }
            12.5%, 17% { transform: translateX(-12.5%); }
            18.75%, 23.25% { transform: translateX(-18.75%); }
            25%, 29.5% { transform: translateX(-25%); }
            31.25%, 35.75% { transform: translateX(-31.25%); }
            37.5%, 42% { transform: translateX(-37.5%); }
            43.75%, 48.25% { transform: translateX(-43.75%); }
            50%, 54.5% { transform: translateX(-50%); }
            56.25%, 60.75% { transform: translateX(-56.25%); }
            62.5%, 67% { transform: translateX(-62.5%); }
            68.75%, 73.25% { transform: translateX(-68.75%); }
            75%, 79.5% { transform: translateX(-75%); }
            81.25%, 85.75% { transform: translateX(-81.25%); }
            87.5%, 92% { transform: translateX(-87.5%); }
            93.75%, 98.25% { transform: translateX(-93.75%); }
            100% { transform: translateX(0); }
        }

        section { margin-bottom: 40px; background: var(--marfil-suave); padding: 45px; border-radius: 12px; border: 1px solid rgba(197, 160, 89, 0.2); border-top: 6px solid var(--color-principal); }
        section h2 { font-family: 'Cinzel', serif; color: var(--color-principal); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--crema-antiguo); }

        .btn-container { margin-top: 25px; margin-bottom: 35px; }
        .btn-action { display: inline-block; background-color: var(--rosa-pompeya); color: white; text-decoration: none; padding: 12px 28px; font-weight: 700; border-radius: 4px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .btn-action:hover { background-color: var(--color-principal); transform: translateY(-2px); }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 8px; margin-top: 30px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .sede-container { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 30px; align-items: center; }
        @media (max-width: 768px) { .sede-container { grid-template-columns: 1fr; } }
        .sede-img-box { border-radius: 8px; overflow: hidden; border: 3px solid var(--oro-viejo); height: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-color: #eee; }
        .sede-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .global-contact-bar { background-color: #eee6d8; text-align: center; padding: 20px; margin: 60px 0 30px 0; border-top: 1px dashed var(--oro-viejo); border-bottom: 1px dashed var(--oro-viejo); }
        .global-contact-bar a { color: var(--rosa-pompeya); font-weight: 700; text-decoration: none; }

        footer { background-color: var(--texto-oscuro); color: var(--crema-antiguo); text-align: center; padding: 40px 20px; border-top: 5px solid var(--oro-viejo); }
        .share-buttons a { color: var(--crema-antiguo); margin: 0 12px; font-size: 1.4rem; }
    </style>
</head>
